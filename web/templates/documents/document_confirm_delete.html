{% extends "dashboard/base.html" %}

{% block title %}Удаление документа — Панель{% endblock %}

{% block dashboard_content %}
<div class="dashboard-home">
  <div class="dashboard-header">
    <h1>Удалить документ #{{ object.pk }}?</h1>
    <p class="dashboard-subtitle">{{ object.document_type.name }}</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="dashboard-actions">
      <button type="submit" class="dashboard-btn danger">Удалить</button>
      <a href="{% url 'dashboard:document_detail' object.pk %}" class="dashboard-btn">
        Отмена
      </a>
    </div>
  </form>
</div>
{% endblock %}
