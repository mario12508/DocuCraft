{% load static %}
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Письмо отправлено</title>
  <link rel="stylesheet" href="{% static 'css/accounts/auth.css' %}">
  <link rel="stylesheet" href="{% static 'css/includes/messages.css' %}">
  <link rel="icon" type="image" href="{% static 'img/favicon.svg' %}">
  <script src="{% static 'js/messages.js' %}"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('site-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

<div class="auth-page">
  <!-- Верхний бар -->
  <header class="auth-topbar">
    <a href="{% url 'accounts:auth' %}" class="auth-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>К авторизации</span>
    </a>

    <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Переключить тему">
      <svg class="theme-icon sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="theme-icon moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </header>

  {% include "includes/messages.html" %}

  <!-- Центрированная карточка -->
  <div class="auth-container" style="display: flex; align-items: center; justify-content: center; padding: 100px 24px 40px;">
    <div class="auth-form-content" style="max-width: 420px; text-align: center;">

      <div style="margin-bottom: 20px; color: var(--auth-text);">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>

      <div class="auth-header">
        <span class="auth-label">Успешно</span>
        <h1>Проверьте почту</h1>
        <p class="auth-subtitle">Мы отправили инструкцию по восстановлению пароля на указанный e-mail.</p>
      </div>

      <div class="auth-hint" style="margin-bottom: 24px;">
        Если письмо не пришло в течение пары минут, проверьте папку «Спам».
      </div>

      <a href="{% url 'accounts:auth' %}" class="auth-submit" style="display: inline-block; text-decoration: none; line-height: 52px; text-align: center;">
        Вернуться к входу
      </a>

    </div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('site-theme', next);
  }
</script>
</body>
</html>
