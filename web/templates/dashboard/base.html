{% extends "base.html" %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/dashboard/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="dashboard-container">
  <div class="dashboard-overlay" id="dashboardOverlay"></div>

  <aside class="dashboard-sidebar" id="dashboardSidebar">
    <button class="mobile-edge-toggle" id="mobileEdgeToggle" aria-label="Открыть панель">
      <i class="bi bi-chevron-right"></i>
    </button>

    <div class="dashboard-sidebar-inner">
      <div class="dashboard-sidebar-header">
        <div class="dashboard-sidebar-brand">
          <span class="brand-text">Рабочая панель</span>
        </div>
        <button class="dashboard-sidebar-toggle" id="toggleBtn" aria-label="Свернуть панель">
          <i class="bi bi-chevron-left" id="toggleIcon"></i>
        </button>
      </div>

      <nav class="dashboard-nav">
        <a href="{% url 'dashboard:home' %}"
           class="dashboard-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
          <i class="bi bi-grid"></i>
          <span class="link-text">Главная</span>
          <span class="tooltip">Главная</span>
        </a>

        <a href="{% url 'dashboard:documents' %}"
           class="dashboard-nav-link {% if 'document' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-file-earmark-text"></i>
          <span class="link-text">Документы</span>
          <span class="tooltip">Документы</span>
        </a>

        <a href="{% url 'documents:step1' %}"
           class="dashboard-nav-link {% if 'step' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-plus-square"></i>
          <span class="link-text">Создать документ</span>
          <span class="tooltip">Создать документ</span>
        </a>
      </nav>
    </div>
  </aside>

  <main class="dashboard-content" id="dashboardContent">
    {% block dashboard_content %}{% endblock %}
  </main>
</div>

<script>
  (function() {
    const sidebar = document.getElementById('dashboardSidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    const mobileEdgeToggle = document.getElementById('mobileEdgeToggle');
    const overlay = document.getElementById('dashboardOverlay');

    function isMobile() {
      return window.innerWidth <= 768;
    }

    function setDesktopCollapsed(collapsed) {
      sidebar.classList.toggle('collapsed', collapsed);
      localStorage.setItem('dashboardSidebarCollapsed', String(collapsed));
      if (toggleIcon) {
        toggleIcon.className = collapsed ? 'bi bi-chevron-right' : 'bi bi-chevron-left';
      }
    }

    function setMobileOpen(open) {
      sidebar.classList.toggle('mobile-open', open);
      overlay.classList.toggle('visible', open);
      document.body.classList.toggle('drawer-open', open);
    }

    function init() {
      if (isMobile()) {
        setMobileOpen(false);
        sidebar.classList.remove('collapsed');
      } else {
        setMobileOpen(false);
        const isCollapsed = localStorage.getItem('dashboardSidebarCollapsed') === 'true';
        setDesktopCollapsed(isCollapsed);
      }
    }

    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!isMobile()) {
        const isCollapsed = sidebar.classList.contains('collapsed');
        setDesktopCollapsed(!isCollapsed);
      }
    });

    if (mobileEdgeToggle) {
      mobileEdgeToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = sidebar.classList.contains('mobile-open');
        setMobileOpen(!isOpen);
      });
    }

    overlay.addEventListener('click', function() {
      setMobileOpen(false);
    });

    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(init, 200);
    });

    init();
  })();
</script>
{% endblock %}
